<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="695" viewBox="0 0 1340 695" role="img" aria-labelledby="title desc">
<title id="title">Access and audience boundaries</title><desc id="desc">Each source or output retains its restrictions. The shared policy engine applies current access rather than trusting the portal, an old link, a cached result or an administrator title.</desc>
<rect width="1340" height="695" fill="white"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8Z" fill="#59778A"/></marker></defs>
<text x="50" y="47" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#153C52">Access and audience boundaries</text>
<text x="50" y="79" font-family="Arial,sans-serif" font-size="15" fill="#536C7B">CURRENT CODE  |  Project Kestrel  |  Model and code snapshot 24 November 2026</text>
<text x="50" y="112" font-family="Arial,sans-serif" font-size="15" fill="#536C7B">Arrows show the labelled workflow or dependency. Source code status is separate from deployment acceptance.</text>
<path d="M420,244 L485,244" fill="none" stroke="#59778A" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M855,244 L920,244" fill="none" stroke="#59778A" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1105,335 L1105,399" fill="none" stroke="#59778A" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M920,490 L855,490" fill="none" stroke="#59778A" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M485,490 L420,490" fill="none" stroke="#59778A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="153" width="370" height="182" rx="9" fill="#E8F2F7" stroke="#A8BFCD"/>
<text x="68" y="182" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173F56">Verify the person</text>
<text x="68" y="210" font-family="Arial,sans-serif" font-size="16" fill="#294958">Active account and server session</text>
<text x="68" y="232" font-family="Arial,sans-serif" font-size="16" fill="#294958">Correct organization on the host</text>
<text x="68" y="254" font-family="Arial,sans-serif" font-size="16" fill="#294958">Roles are not supplied by headers</text>
<rect x="485" y="153" width="370" height="182" rx="9" fill="#E8F2F7" stroke="#A8BFCD"/>
<text x="503" y="182" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173F56">Check current matter scope</text>
<text x="503" y="210" font-family="Arial,sans-serif" font-size="16" fill="#294958">Assigned and permitted action</text>
<text x="503" y="232" font-family="Arial,sans-serif" font-size="16" fill="#294958">Ethical wall denial overrides</text>
<text x="503" y="254" font-family="Arial,sans-serif" font-size="16" fill="#294958">Named clean-team scope and expiry</text>
<rect x="920" y="153" width="370" height="182" rx="9" fill="#E8F2F7" stroke="#A8BFCD"/>
<text x="938" y="182" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173F56">Check the exact source</text>
<text x="938" y="210" font-family="Arial,sans-serif" font-size="16" fill="#294958">Document and passage restrictions</text>
<text x="938" y="232" font-family="Arial,sans-serif" font-size="16" fill="#294958">Processing permission when relevant</text>
<text x="938" y="254" font-family="Arial,sans-serif" font-size="16" fill="#294958">Current source-version entitlement</text>
<rect x="920" y="399" width="370" height="182" rx="9" fill="#EEF2FA" stroke="#A8BFCD"/>
<text x="938" y="428" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173F56">Check the output decision</text>
<text x="938" y="456" font-family="Arial,sans-serif" font-size="16" fill="#294958">Lawyer and report review</text>
<text x="938" y="478" font-family="Arial,sans-serif" font-size="16" fill="#294958">Audience-specific release</text>
<text x="938" y="500" font-family="Arial,sans-serif" font-size="16" fill="#294958">Separate antitrust gate if required</text>
<rect x="485" y="399" width="370" height="182" rx="9" fill="#EEF2FA" stroke="#A8BFCD"/>
<text x="503" y="428" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173F56">Serve only allowed content</text>
<text x="503" y="456" font-family="Arial,sans-serif" font-size="16" fill="#294958">Recheck guarded output</text>
<text x="503" y="478" font-family="Arial,sans-serif" font-size="16" fill="#294958">No-store downloads and responses</text>
<text x="503" y="500" font-family="Arial,sans-serif" font-size="16" fill="#294958">Safe denials and scoped audit</text>
<rect x="50" y="399" width="370" height="182" rx="9" fill="#EEF2FA" stroke="#A8BFCD"/>
<text x="68" y="428" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173F56">Keep duties separate</text>
<text x="68" y="456" font-family="Arial,sans-serif" font-size="16" fill="#294958">Admin has no blanket content right</text>
<text x="68" y="478" font-family="Arial,sans-serif" font-size="16" fill="#294958">Halden release is not bank release</text>
<text x="68" y="500" font-family="Arial,sans-serif" font-size="16" fill="#294958">Membership alone grants no source</text>
<text x="50" y="624" font-family="Arial,sans-serif" font-size="15" fill="#3C596B">Each source or output retains its restrictions. The shared policy engine applies current access rather than trusting the portal, an old</text>
<text x="50" y="646" font-family="Arial,sans-serif" font-size="15" fill="#3C596B">link, a cached result or an administrator title.</text>
