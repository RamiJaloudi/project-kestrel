<rect x="50" y="153" width="370" height="182" rx="9" fill="#E8F2F7" stroke="#A8BFCD"/>
<text x="68" y="182" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173F56">Read a permitted source</text>
<text x="68" y="210" font-family="Arial,sans-serif" font-size="16" fill="#294958">Original or approved transcript</text>
<text x="68" y="232" font-family="Arial,sans-serif" font-size="16" fill="#294958">Retain literal amount and anchor</text>
<text x="68" y="254" font-family="Arial,sans-serif" font-size="16" fill="#294958">Do not execute spreadsheet formulas</text>
<rect x="485" y="153" width="370" height="182" rx="9" fill="#E8F2F7" stroke="#A8BFCD"/>
<text x="503" y="182" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173F56">Capture exact dimensions</text>
<text x="503" y="210" font-family="Arial,sans-serif" font-size="16" fill="#294958">Entity, metric, period and currency</text>
<text x="503" y="232" font-family="Arial,sans-serif" font-size="16" fill="#294958">Scale and accounting context</text>
<text x="503" y="254" font-family="Arial,sans-serif" font-size="16" fill="#294958">Unknown dimensions stay unknown</text>
<rect x="920" y="153" width="370" height="182" rx="9" fill="#E8F2F7" stroke="#A8BFCD"/>
<text x="938" y="182" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173F56">Independent verification</text>
<text x="938" y="210" font-family="Arial,sans-serif" font-size="16" fill="#294958">Different cleared lawyer checks</text>
<text x="938" y="232" font-family="Arial,sans-serif" font-size="16" fill="#294958">Verify the number and dimensions</text>
<text x="938" y="254" font-family="Arial,sans-serif" font-size="16" fill="#294958">Original evidence remains retained</text>
<rect x="920" y="399" width="370" height="182" rx="9" fill="#EEF2FA" stroke="#A8BFCD"/>
<text x="938" y="428" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173F56">Compare eligible facts</text>
<text x="938" y="456" font-family="Arial,sans-serif" font-size="16" fill="#294958">Require matching dimensions</text>
<text x="938" y="478" font-family="Arial,sans-serif" font-size="16" fill="#294958">Use exact decimal arithmetic</text>
<text x="938" y="500" font-family="Arial,sans-serif" font-size="16" fill="#294958">No inferred FX conversion</text>
<rect x="485" y="399" width="370" height="182" rx="9" fill="#EEF2FA" stroke="#A8BFCD"/>
<text x="503" y="428" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173F56">Retain a conflict decision</text>
<text x="503" y="456" font-family="Arial,sans-serif" font-size="16" fill="#294958">Keep both conflicting facts</text>
<text x="503" y="478" font-family="Arial,sans-serif" font-size="16" fill="#294958">Independent source-cleared decision</text>
<text x="503" y="500" font-family="Arial,sans-serif" font-size="16" fill="#294958">Prefer a source or stay unresolved</text>
<rect x="50" y="399" width="370" height="182" rx="9" fill="#EEF2FA" stroke="#A8BFCD"/>
<text x="68" y="428" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173F56">Release selected facts</text>
<text x="68" y="456" font-family="Arial,sans-serif" font-size="16" fill="#294958">Approved sanitized source required</text>
<text x="68" y="478" font-family="Arial,sans-serif" font-size="16" fill="#294958">Independent fact release decision</text>
<text x="68" y="500" font-family="Arial,sans-serif" font-size="16" fill="#294958">Bank feature and item gates both apply</text>
<text x="50" y="624" font-family="Arial,sans-serif" font-size="15" fill="#3C596B">This baseline does not implement a general financial analyst agent, broad automatic table recognition, or a valuation/materiality engine.</text>
