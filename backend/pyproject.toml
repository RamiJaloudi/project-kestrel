[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "project-kestrel-safe-starter"
version = "0.1.0"
requires-python = ">=3.11"
description = "Synthetic local diligence workspace with authenticated portals and governed AI workflows"
dependencies = ["fastapi>=0.110,<1", "pydantic>=2,<3", "uvicorn>=0.29,<1", "sqlalchemy>=2.0,<3", "alembic>=1.13,<2", "argon2-cffi>=23,<26", "pypdf>=5,<7", "python-docx>=1.1,<2", "openpyxl>=3.1,<4", "reportlab>=4.4,<5", "defusedxml>=0.7,<1", "tzdata==2026.6"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "cryptography>=43,<47"]
ddr = ["langgraph==1.2.24", "langchain-core==1.8.4", "langchain-openai==1.8.5", "langgraph-checkpoint==4.3.2", "langgraph-checkpoint-sqlite==3.1.3", "openai==2.54.0"]

[tool.setuptools.packages.find]
include = ["kestrel*"]

[tool.setuptools.package-data]
kestrel = ["swagger_session.js", "data/workflow_scripts/*.json", "data/workflow_scripts/*.xlsx", "data/resource_library/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
