<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="695" viewBox="0 0 1340 695" role="img" aria-labelledby="title desc">
<title id="title">Audit backup and retention</title><desc id="desc">Local integrity evidence is not external WORM storage or proven disaster recovery. The Azure restore and service acceptance are separate live operations.</desc>
<rect width="1340" height="695" fill="white"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8Z" fill="#59778A"/></marker></defs>
<text x="50" y="47" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#153C52">Audit backup and retention</text>
<text x="50" y="79" font-family="Arial,sans-serif" font-size="15" fill="#536C7B">CURRENT CODE  |  Project Kestrel  |  Model and code snapshot 24 November 2026</text>
<text x="50" y="112" font-family="Arial,sans-serif" font-size="15" fill="#536C7B">Arrows show the labelled workflow or dependency. Source code status is separate from deployment acceptance.</text>
<path d="M420,244 L485,244" fill="none" stroke="#59778A" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M855,244 L920,244" fill="none" stroke="#59778A" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1105,335 L1105,399" fill="none" stroke="#59778A" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M920,490 L855,490" fill="none" stroke="#59778A" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M485,490 L420,490" fill="none" stroke="#59778A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="153" width="370" height="182" rx="9" fill="#E8F2F7" stroke="#A8BFCD"/>
<text x="68" y="182" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173F56">Retain scoped audit</text>
<text x="68" y="210" font-family="Arial,sans-serif" font-size="16" fill="#294958">Actor, action, time and object</text>
<text x="68" y="232" font-family="Arial,sans-serif" font-size="16" fill="#294958">Avoid confidential source passages</text>
<text x="68" y="254" font-family="Arial,sans-serif" font-size="16" fill="#294958">Export only permitted event scope</text>
<rect x="485" y="153" width="370" height="182" rx="9" fill="#E8F2F7" stroke="#A8BFCD"/>
<text x="503" y="182" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173F56">Protect source archives</text>
<text x="503" y="210" font-family="Arial,sans-serif" font-size="16" fill="#294958">Encrypted retained source bytes</text>
<text x="503" y="232" font-family="Arial,sans-serif" font-size="16" fill="#294958">Separate protected key bindings</text>
<text x="503" y="254" font-family="Arial,sans-serif" font-size="16" fill="#294958">Verify integrity before reading</text>
<rect x="920" y="153" width="370" height="182" rx="9" fill="#E8F2F7" stroke="#A8BFCD"/>
<text x="938" y="182" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173F56">Test recovery separately</text>
<text x="938" y="210" font-family="Arial,sans-serif" font-size="16" fill="#294958">Restore an isolated database</text>
<text x="938" y="232" font-family="Arial,sans-serif" font-size="16" fill="#294958">Check source and archive access</text>
<text x="938" y="254" font-family="Arial,sans-serif" font-size="16" fill="#294958">Keep actual recovery evidence</text>
<rect x="920" y="399" width="370" height="182" rx="9" fill="#EEF2FA" stroke="#A8BFCD"/>
<text x="938" y="428" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173F56">Freeze the signing record</text>
<text x="938" y="456" font-family="Arial,sans-serif" font-size="16" fill="#294958">Exact manifest and version bindings</text>
<text x="938" y="478" font-family="Arial,sans-serif" font-size="16" fill="#294958">Independent authorized decision</text>
<text x="938" y="500" font-family="Arial,sans-serif" font-size="16" fill="#294958">Operational history remains separate</text>
<rect x="485" y="399" width="370" height="182" rx="9" fill="#EEF2FA" stroke="#A8BFCD"/>
<text x="503" y="428" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173F56">Apply holds and instructions</text>
<text x="503" y="456" font-family="Arial,sans-serif" font-size="16" fill="#294958">Confirm retention obligations</text>
<text x="503" y="478" font-family="Arial,sans-serif" font-size="16" fill="#294958">Hold can block eligible copy deletion</text>
<text x="503" y="500" font-family="Arial,sans-serif" font-size="16" fill="#294958">No blanket client deletion promise</text>
<rect x="50" y="399" width="370" height="182" rx="9" fill="#EEF2FA" stroke="#A8BFCD"/>
<text x="68" y="428" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173F56">Record authorized disposal</text>
<text x="68" y="456" font-family="Arial,sans-serif" font-size="16" fill="#294958">Independent closing/security controls</text>
<text x="68" y="478" font-family="Arial,sans-serif" font-size="16" fill="#294958">Retain firm records where required</text>
<text x="68" y="500" font-family="Arial,sans-serif" font-size="16" fill="#294958">Do not delete audit history silently</text>
<text x="50" y="624" font-family="Arial,sans-serif" font-size="15" fill="#3C596B">Local integrity evidence is not external WORM storage or proven disaster recovery. The Azure restore and service acceptance are separate</text>
<text x="50" y="646" font-family="Arial,sans-serif" font-size="15" fill="#3C596B">live operations.</text>
</svg>