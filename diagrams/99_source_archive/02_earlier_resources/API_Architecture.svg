<rect x="652" y="127" width="278" height="228" rx="10" fill="#FFF4DE" stroke="#AEC1CE"/>
<text x="671" y="163" font-family="Arial,sans-serif" font-size="19" fill="#173E58" font-weight="700">3  Policy and services</text>
<text x="671" y="202" font-family="Arial,sans-serif" font-size="16" fill="#263F4F">Shared source access policy</text>
<text x="671" y="230" font-family="Arial,sans-serif" font-size="16" fill="#263F4F">Evidence and review rules</text>
