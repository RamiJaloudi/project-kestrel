<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-labelledby="title desc">
<title id="title">How the API connects the application</title><desc id="desc">One typed API supports the portals. Calling an endpoint never creates permission. OpenAPI describes current request and response contracts. Model CSVs describe the code-declared structure.
The proposed 809-field design is separate. Enterprise integrations remain design or mock adapters where stated.</desc>
<rect width="1280" height="470" fill="#FFFFFF"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#567083"/></marker></defs>
<text x="42" y="52" font-family="Arial,sans-serif" font-size="29" fill="#15384D" font-weight="700">How the API connects the application</text>
<text x="42" y="86" font-family="Arial,sans-serif" font-size="17" fill="#4C6373">One typed API supports the portals. Calling an endpoint never creates permission.</text>
<rect x="42" y="127" width="278" height="228" rx="10" fill="#E8F2F7" stroke="#AEC1CE"/>
