<text x="61" y="258" font-family="Arial,sans-serif" font-size="16" fill="#263F4F">Same-origin API requests</text>
<text x="61" y="286" font-family="Arial,sans-serif" font-size="16" fill="#263F4F">CSRF token for state changes</text>
