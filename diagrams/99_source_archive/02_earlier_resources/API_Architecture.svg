<text x="366" y="202" font-family="Arial,sans-serif" font-size="16" fill="#263F4F">Pydantic request validation</text>
<text x="366" y="230" font-family="Arial,sans-serif" font-size="16" fill="#263F4F">Current identity dependency</text>
<text x="366" y="258" font-family="Arial,sans-serif" font-size="16" fill="#263F4F">Audience and route checks</text>
