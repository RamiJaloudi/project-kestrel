<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-labelledby="title desc">
<title id="title">Azure portal deployment</title><desc id="desc">DNS configured on 24 November 2026. HTTPS and application activation have separate acceptance gates. Configured hostnames are not evidence of a live public application. Do not bypass the CLOSED gate.
Linux requires replacements for DPAPI, Windows service control and the owner approval boundary.</desc>
<rect width="1280" height="470" fill="#FFFFFF"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#567083"/></marker></defs>
<text x="42" y="52" font-family="Arial,sans-serif" font-size="29" fill="#15384D" font-weight="700">Azure portal deployment</text>
<text x="42" y="86" font-family="Arial,sans-serif" font-size="17" fill="#4C6373">DNS configured on 24 November 2026. HTTPS and application activation have separate acceptance gates.</text>
<rect x="42" y="127" width="278" height="228" rx="10" fill="#E8F2F7" stroke="#AEC1CE"/>
<text x="61" y="163" font-family="Arial,sans-serif" font-size="19" fill="#173E58" font-weight="700">1  Five portal names</text>
<text x="61" y="202" font-family="Arial,sans-serif" font-size="16" fill="#263F4F">portal.ramijaloudi.com</text>
<text x="61" y="230" font-family="Arial,sans-serif" font-size="16" fill="#263F4F">firm / halden / castlegate</text>
<text x="61" y="258" font-family="Arial,sans-serif" font-size="16" fill="#263F4F">admin under portal domain</text>
<text x="61" y="286" font-family="Arial,sans-serif" font-size="16" fill="#263F4F">GoDaddy A records; TTL 600</text>
<path d="M323,241 L343,241" stroke="#567083" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="347" y="127" width="278" height="228" rx="10" fill="#EEF1FA" stroke="#AEC1CE"/>
<text x="366" y="163" font-family="Arial,sans-serif" font-size="19" fill="#173E58" font-weight="700">2  Azure Windows VM</text>
<text x="366" y="202" font-family="Arial,sans-serif" font-size="16" fill="#263F4F">Static IP 52.162.140.174</text>
<text x="366" y="230" font-family="Arial,sans-serif" font-size="16" fill="#263F4F">Windows Server runtime</text>
<text x="366" y="258" font-family="Arial,sans-serif" font-size="16" fill="#263F4F">Shared proxy is controlled</text>
<text x="366" y="286" font-family="Arial,sans-serif" font-size="16" fill="#263F4F">Existing RPlus route preserved</text>
<path d="M628,241 L648,241" stroke="#567083" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="652" y="127" width="278" height="228" rx="10" fill="#FFF4DE" stroke="#AEC1CE"/>
<text x="671" y="163" font-family="Arial,sans-serif" font-size="19" fill="#173E58" font-weight="700">3  Private app services</text>
<text x="671" y="202" font-family="Arial,sans-serif" font-size="16" fill="#263F4F">Caddy to loopback FastAPI</text>
<text x="671" y="230" font-family="Arial,sans-serif" font-size="16" fill="#263F4F">React screens and OpenAPI</text>
<text x="671" y="258" font-family="Arial,sans-serif" font-size="16" fill="#263F4F">PostgreSQL and worker</text>
<text x="671" y="286" font-family="Arial,sans-serif" font-size="16" fill="#263F4F">Separate service identities</text>
<path d="M933,241 L953,241" stroke="#567083" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="957" y="127" width="278" height="228" rx="10" fill="#E6F4EC" stroke="#AEC1CE"/>
<text x="976" y="163" font-family="Arial,sans-serif" font-size="19" fill="#173E58" font-weight="700">4  Activation still gated</text>
<text x="976" y="202" font-family="Arial,sans-serif" font-size="16" fill="#263F4F">Check real restore and backup</text>
<text x="976" y="230" font-family="Arial,sans-serif" font-size="16" fill="#263F4F">Validate exact HTTPS names</text>
<text x="976" y="258" font-family="Arial,sans-serif" font-size="16" fill="#263F4F">Review effective access rules</text>
<text x="976" y="286" font-family="Arial,sans-serif" font-size="16" fill="#263F4F">Obtain public acceptance</text>
<text x="42" y="398" font-family="Arial,sans-serif" font-size="16" fill="#344F60">Configured hostnames are not evidence of a live public application. Do not bypass the CLOSED gate.</text>
<text x="42" y="423" font-family="Arial,sans-serif" font-size="16" fill="#344F60">Linux requires replacements for DPAPI, Windows service control and the owner approval boundary.</text>
</svg>